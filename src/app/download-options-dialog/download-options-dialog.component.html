<h2 mat-dialog-title>Download Options</h2>
<mat-dialog-content class="dialog-content-custom">
  <p class="text-lg text-gray-700 mb-6">Please select a download option:</p>
  <div class="button-group">
    <button mat-raised-button [color]="themeService.getTheme()" (click)="selectOption('current')" class="option-button">
      <mat-icon>article</mat-icon> Download Current Article
    </button>
    <button mat-raised-button [color]="themeService.getTheme()" (click)="selectOption('category')" class="option-button"
      [disabled]="isCurrentArticlePaid"> <!-- ADDED: Disable if the article is paid -->
      <mat-icon>collections_bookmark</mat-icon> Download All from Category
    </button>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="dialog-actions-custom">
  <button mat-button mat-dialog-close class="cancel-button">Cancel</button>
</mat-dialog-actions>
