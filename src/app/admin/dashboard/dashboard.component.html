<mat-card style="padding: 30px; border-radius: 20px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(8px); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);">
  
  <h2 style="text-align: center; color: #2e3a59;">👋 Welcome to Article Hub Admin Panel</h2>

  <p style="margin-top: 10px; color: #dcdfea; font-size: 16px; text-align: center;">
    🚀 Ready to take control of your Article Hub?
  </p>

  <p style="font-size: 14px; color: #dcdfea; margin-bottom: 20px; text-align: center;">
    Manage articles, analyze user engagement, and publish top-notch content with ease.
  </p>

  <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 30px;">
    <button mat-raised-button color="primary">📊 Dashboard</button>
    <!-- <button mat-raised-button color="accent">✍️ Create Article</button> -->
    <button mat-raised-button style="background-color: #006400; color: white;">✍️ Create Article</button>
    <button mat-raised-button style="background-color: #640000; color: white;">🔒 Manage Users</button>
  </div>

  <!-- Motivational Quote Section -->
  <div style="margin-top: 30px; background: #abb2c4; padding: 20px; border-left: 5px solid #3c3e95; border-radius: 8px;">
    <h4 style="margin: 0; color: #2f2f7d;">📝 Thought of the Day</h4>
    <p style="margin: 5px 0 0; font-style: italic;">
      “Words have power. Use them to inspire, inform, and impact.”
    </p>
  </div>

  <!-- Visual Stats Section -->
  <div style="margin-top: 40px; display: flex; flex-wrap: wrap; justify-content: space-around; text-align: center;">
    <div style="min-width: 150px; margin: 10px; padding: 20px; background-color: #d6aeae; border-radius: 12px;">
      <h3 style="margin: 0; color: #3c3e95;">128</h3>
      <p style="margin: 0;">Articles</p>
    </div>
    <div style="min-width: 150px; margin: 10px; padding: 20px; background-color: #7d8aa0; border-radius: 12px;">
      <h3 style="margin: 0; color: #3c3e95;">256</h3>
      <p style="margin: 0;">Users</p>
    </div>
    <div style="min-width: 150px; margin: 10px; padding: 20px; background-color: #91ac7b; border-radius: 12px;">
      <h3 style="margin: 0; color: #3c3e95;">94%</h3>
      <p style="margin: 0;">Engagement</p>
    </div>
  </div>

</mat-card>
