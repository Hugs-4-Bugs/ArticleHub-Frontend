<mat-card>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <b><span>Manage Category</span></b>
      <button mat-flat-button [color]="themeService.getTheme()" (click)="handleAddAction()">Add Category</button>
    </div>
  </mat-card>
  
  <hr>
  
  <mat-card>
    <mat-form-field appearance="fill" [color]="themeService.getTheme()">
      <mat-label>Filter</mat-label>
      <input matInput (keyup)="applyFilter($event)" #input>
    </mat-form-field>
  </mat-card>
  
  <div class="responsive_table">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>
            <b>Name</b>
        </th>
        <td mat-cell *matCellDef="let element">{{element.name}}</td>
      </ng-container>
  
      <ng-container matColumnDef="edit">
        <th mat-header-cell *matHeaderCellDef>
            <b>Action</b>
        </th>
        <td mat-cell *matCellDef="let element" class="action-link">
          <button mat-icon-button [color]="themeService.getTheme()" matTooltip="Edit" (click)="handleEditAction(element)">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky:true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
