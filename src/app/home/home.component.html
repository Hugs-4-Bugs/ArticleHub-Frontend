<!-- HEADER -->
<mat-toolbar class="header mat-elevation-z8" [color]="themeService.getTheme()">
  <strong style="display: flex; align-items: center; gap: 6px;">
    <mat-icon>library_books</mat-icon>
    Article Hub
  </strong>
  <span class="spacer"></span>
  <button mat-icon-button [matMenuTriggerFor]="menu">
    <mat-icon>palette</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-fab color="primary" class="button-margin" (click)="changeTheme('primary')">
      <mat-icon *ngIf="themeService.getTheme() === 'primary'">done</mat-icon>
    </button>
    <button mat-fab color="accent" class="button-margin" (click)="changeTheme('accent')">
      <mat-icon *ngIf="themeService.getTheme() === 'accent'">done</mat-icon>
    </button>
    <button mat-fab color="warn" class="button-margin" (click)="changeTheme('warn')">
      <mat-icon *ngIf="themeService.getTheme() === 'warn'">done</mat-icon>
    </button>
  </mat-menu>

  <button mat-icon-button [routerLink]="['/login']">
    <mat-icon>login</mat-icon>
  </button>
</mat-toolbar> 


<!-- MAIN CONTENT -->
<div class="content-wrapper">
  <mat-form-field appearance="fill" [color]="themeService.getTheme()" class="filter-field">
    <mat-label>Filter</mat-label>
    <input matInput [(ngModel)]="searchText" (input)="filteredItems()" placeholder="Search articles...">
  </mat-form-field>

  <div class="card-container">
    <mat-card *ngFor="let card of filteredItems()" class="card hover-card" (click)="handleViewAction(card)">
      <mat-card-header>
        <mat-card-title>
          <b>{{ card.title }}</b>
        </mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="card-detail">
          <span class="label">📁 Category:</span>
          <span class="value">{{ card.categoryName }}</span>
        </div>
        <div class="card-detail">
          <span class="label">📅 Published:</span>
          <span class="value">{{ card.publication_date | date:'dd-MM-yyyy' }}</span>
        </div>
      </mat-card-content>
    </mat-card>
  </div>

  <h2 *ngIf="filteredItems()?.length === 0" class="no-results">🚫 Nothing to show</h2>
</div>


<!-- FOOTER -->

    <span>

</mat-toolbar>
